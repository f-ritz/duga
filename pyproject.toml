[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duga"
version = "0.2.0"
description = "Duga 0.2.0 \"Berkut-B\" - Fully local AI daily personal briefing agent. Web + social + websites → LLM (DeepSeek) → Telegram."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Duga Contributors"}
]
keywords = ["ai", "agent", "briefing", "daily", "personal-assistant", "telegram"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "openai>=1.35.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "trafilatura>=1.12.0",
    "duckduckgo-search>=6.3.0",
    "Pillow>=10.4.0",
    "platformdirs>=4.2.0",
]

[project.optional-dependencies]
schedule = ["apscheduler>=3.10.4"]
full = ["apscheduler>=3.10.4", "twscrape>=0.9.0"]
mobile = ["kivy>=2.3.0", "kivymd>=1.1.1"]
windows = []  # Uses only stdlib tkinter + ttk (native Windows look)

[project.scripts]
duga = "duga.main:main"

[project.urls]
Homepage = "https://github.com/yourname/duga"
Repository = "https://github.com/yourname/duga"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duga = ["templates/*"]

[tool.uv]
dev-dependencies = []
